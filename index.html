<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>BBRacing Map Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/style.css">

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="app">

    <!-- =====================================================
         BARRA SUPERIOR
         ===================================================== -->

    <header id="toolbar">

        <div class="brand">
            <span class="brandMark">▲</span>
            <span class="brandText">
                BBRACING <strong>MAP EDITOR</strong>
            </span>
        </div>

        <div class="toolGroup">

            <button id="openMap" class="toolBtn" data-label="Json">
                <span class="ic">📂</span><span class="lbl">JSON</span>
            </button>

            <button id="copyObject" class="toolBtn" data-label="Copiar">
                <span class="ic">📋</span><span class="lbl">Copiar</span>
            </button>

            <button id="pasteObject" class="toolBtn" data-label="Pegar">
                <span class="ic">📥</span><span class="lbl">Pegar</span>
            </button>

            <button id="deleteObject" class="toolBtn danger" data-label="Borrar">
                <span class="ic">🗑</span>
            </button>

        </div>

        <div class="toolGroup">

            <button id="toggleWorldVis" class="toolBtn toggleBtn active" data-label="Mapa">
                <span class="ic">🗺</span><span class="lbl">Mapa</span>
            </button>

            <button id="toggleOOBVis" class="toolBtn toggleBtn" data-label="Límites">
                <span class="ic">⛶</span><span class="lbl">Límites</span>
            </button>

            <button id="toggleGrid" class="toolBtn toggleBtn active" data-label="Grid">
                <span class="ic">▦</span><span class="lbl">Grid</span>
            </button>

        </div>

        <button id="saveMap" class="toolBtn primary" data-label="Guardar">
            <span class="ic">💾</span><span class="lbl">Guardar</span>
        </button>

        <div class="statusReadout">
            <span class="statusDot"></span>
            <span id="mapStatus" class="statusText">Sin mapa</span>
        </div>

    </header>


    <!-- =====================================================
         ESCENA 3D
         ===================================================== -->

    <main id="viewport"></main>


    <!-- =====================================================
         LISTA DE OBJETOS
         ===================================================== -->

    <aside id="objectPanel" class="dock">

        <div class="panelTitle">
            <span class="titleTick"></span>
            JERARQUÍA
        </div>

        <div id="objectList">

            <div class="empty">
                No hay objetos
            </div>

        </div>

    </aside>


    <!-- =====================================================
         INSPECTOR
         ===================================================== -->

    <aside id="inspector" class="dock">

        <div class="panelTitle">
            <span class="titleTick"></span>
            INSPECTOR
        </div>

        <div id="noSelection">
            Selecciona un objeto en la escena o en la jerarquía.
        </div>


        <div id="objectInspector"
             class="hidden">

            <div class="objectName"
                 id="selectedName">
                Objeto
            </div>


            <!-- POSICIÓN -->

            <section class="xyzSection">

                <h3><span class="secIc">⊹</span> Posición</h3>

                <div class="xyzRow">
                    <label class="axisX">
                        <span>X</span>
                        <input id="posX" type="number" step="0.01">
                    </label>

                    <label class="axisY">
                        <span>Y</span>
                        <input id="posY" type="number" step="0.01">
                    </label>

                    <label class="axisZ">
                        <span>Z</span>
                        <input id="posZ" type="number" step="0.01">
                    </label>
                </div>

            </section>


            <!-- ROTACIÓN -->

            <section class="xyzSection">

                <h3><span class="secIc">↻</span> Rotación</h3>

                <div class="xyzRow">
                    <label class="axisX">
                        <span>X</span>
                        <input id="rotX" type="number" step="0.1">
                    </label>

                    <label class="axisY">
                        <span>Y</span>
                        <input id="rotY" type="number" step="0.1">
                    </label>

                    <label class="axisZ">
                        <span>Z</span>
                        <input id="rotZ" type="number" step="0.1">
                    </label>
                </div>

            </section>


            <!-- ESCALA -->

            <section class="xyzSection">

                <h3><span class="secIc">⤢</span> Escala</h3>

                <div class="xyzRow">
                    <label class="axisX">
                        <span>X</span>
                        <input id="scaleX" type="number" step="0.01">
                    </label>

                    <label class="axisY">
                        <span>Y</span>
                        <input id="scaleY" type="number" step="0.01">
                    </label>

                    <label class="axisZ">
                        <span>Z</span>
                        <input id="scaleZ" type="number" step="0.01">
                    </label>
                </div>

            </section>


            <button id="applyTransform" class="fullButton primary">
                Aplicar cambios
            </button>

            <button id="focusObject" class="fullButton">
                🎯 Enfocar cámara
            </button>

        </div>

    </aside>

    <!-- =====================================================
         INFORMACIÓN / TOAST
         ===================================================== -->

    <div id="popup">
        <span class="popupDot"></span>
        <p id="fuckyou">Ready</p>
    </div>

    <!-- =====================================================
         AYUDA
         ===================================================== -->

    <div id="controlsInfo">
        <span>🖱 Arrastrar — cámara</span>
        <span class="sep">/</span>
        <span>Rueda — zoom</span>
        <span class="sep">/</span>
        <span>Click — seleccionar</span>
    </div>


    <!-- INPUTS -->

    <input id="mapFile" type="file" accept=".json" hidden>

</div>


<script
    type="module"
    src="src/main.js">
</script>

</body>
</html>
